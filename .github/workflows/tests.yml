name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline demo and core tests without site packages
        run: |
          python -B -S demo.py
          python -B -S -m unittest -q test_usage_store test_verified_pricing test_release
      - name: Install optional MCP dependencies
        run: python -m pip install -r requirements-mcp.txt
      - name: Run all synthetic tests including MCP
        run: python -B -m unittest -q test_usage_store test_verified_pricing test_release
